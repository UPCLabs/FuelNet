services:
  postgres:
    image: postgres:18
    container_name: fuelnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuelnetdb
      POSTGRES_USER: fuelnet
      POSTGRES_PASSWORD: fuelnet123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelnet -d fuelnetdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  fuel-app-1:
    build: ./fuelnet_back
    container_name: fuelnet_app_1

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./fuelnet_back/.env

    volumes:
      - ./fuelnet_back/firebase-key.json:/app/firebase-key.json

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fuelnetdb
      SPRING_DATASOURCE_USERNAME: fuelnet
      SPRING_DATASOURCE_PASSWORD: fuelnet123
      SERVER_PORT: 3015

    restart: unless-stopped

  fuel-app-2:
    build: ./fuelnet_back
    container_name: fuelnet_app_2

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./fuelnet_back/.env

    volumes:
      - ./fuelnet_back/firebase-key.json:/app/firebase-key.json

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fuelnetdb
      SPRING_DATASOURCE_USERNAME: fuelnet
      SPRING_DATASOURCE_PASSWORD: fuelnet123
      SERVER_PORT: 3015

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: fuelnet_nginx

    depends_on:
      - fuel-app-1
      - fuel-app-2

    ports:
      - "3015:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    restart: unless-stopped

volumes:
  postgres_data:
